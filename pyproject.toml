[project]
name = "connect4-ai"
version = "0.1.0"
description = "Connect 4 opponent using minimax with alpha-beta pruning"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["connect4*"]
