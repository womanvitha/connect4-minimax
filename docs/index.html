<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect 4 — Minimax AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>Connect 4</h1>
    <p class="subtitle">Minimax AI with alpha-beta pruning</p>

    <div id="loading">
      <div class="spinner"></div>
      <p id="loading-msg">Loading Python runtime...</p>
    </div>

    <div id="game" class="hidden">
      <div id="controls">
        <label>
          Difficulty:
          <select id="depth-select">
            <option value="2">Easy (depth 2)</option>
            <option value="4" selected>Medium (depth 4)</option>
            <option value="6">Hard (depth 6)</option>
          </select>
        </label>
        <button id="new-game-btn">New game</button>
      </div>

      <div id="status-bar">
        <span id="status">Your turn</span>
      </div>

      <div id="board-wrap">
        <div id="col-buttons"></div>
        <div id="board"></div>
      </div>

      <div id="stats-bar" class="hidden">
        <span id="stats-text"></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.0/full/pyodide.js"></script>
  <script src="main.js"></script>
</body>
</html>
